<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <defs>
    <filter id="blurFilter">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="#E2E8F0" rx="16"/>
  <!-- Blurry content -->
  <g filter="url(#blurFilter)">
    <rect x="30" y="30" width="340" height="80" fill="#3B82F6" rx="8"/>
    <text x="200" y="75" font-family="Arial" font-size="20" fill="#FFFFFF" text-anchor="middle">BUKTI TRANSFER BANK</text>
    <rect x="30" y="140" width="340" height="380" fill="#FFFFFF" rx="8"/>
    <rect x="50" y="170" width="140" height="20" fill="#CBD5E1"/>
    <rect x="50" y="210" width="280" height="30" fill="#94A3B8"/>
    <rect x="50" y="260" width="180" height="20" fill="#CBD5E1"/>
    <rect x="50" y="300" width="220" height="40" fill="#64748B"/>
    <rect x="50" y="370" width="280" height="15" fill="#E2E8F0"/>
    <rect x="50" y="400" width="280" height="15" fill="#E2E8F0"/>
  </g>
  <!-- Warning Overlay -->
  <rect x="40" y="220" width="320" height="160" fill="#FEF2F2" rx="12" stroke="#EF4444" stroke-width="2"/>
  <circle cx="200" cy="270" r="24" fill="#EF4444"/>
  <text x="200" y="278" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="200" y="325" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#B91C1C" text-anchor="middle">CONTOH BUKTI BURAM / TIDAK JELAS</text>
  <text x="200" y="350" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" fill="#7F1D1D" text-anchor="middle">Gunakan untuk menguji fitur Tolak Pembayaran Admin</text>
</svg>

